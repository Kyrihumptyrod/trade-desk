name: Daily picks

on:
  schedule:
    - cron: "5 0 * * *"      # 00:05 UTC = 08:05 AWST, after the daily close
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  picks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests
      - name: Generate picks and grade history
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python trade_desk.py daily --coins BTC ETH SOL XRP ZEC HYPE --out docs
          cp docs/scorecard.html docs/index.html
      - name: Commit the record
        run: |
          git config user.name "trade-desk-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git commit -m "Picks $(date -u +%F)" || echo "nothing to commit"
          git push
